# Ayder — locale.conf
# Шаг «Локаль»: язык/регион и ЧАСОВОЙ ПОЯС.
#
# В Calamares 3.4.3 отдельного модуля timezone НЕТ — выбор пояса встроен
# в шаг locale (карта TimeZoneWidget + выпадающие Region/Zone). Здесь
# задаётся только СТАРТОВЫЙ пояс страницы; в фазе exec модуль locale
# (SetTimezoneJob) пишет /etc/localtime -> /usr/share/zoneinfo/<region>/<zone>
# и файл /etc/timezone в целевую систему.
#
# useSystemTimezone: true — стартуем с пояса живой системы (QTimeZone в
# live-среде): он подставится вместо region/zone. Ключи region/zone всё
# равно ОБЯЗАТЫ (required в locale.schema.yaml) и служат фолбэком, если
# определить пояс live не удалось.
#
# GeoIP не включаем: без него стартовое определение не трогает сеть.
---
region: Europe
zone: Moscow
useSystemTimezone: true
