# Ayder — packages.conf
# backend pacman; набор пакетов KDE (everyday) ставит /usr/local/bin/ayos-edition
# (shellprocess@ayos_edition), поэтому статические операции не нужны.
# update_system выключен: сетевые обновления не должны ломать
# воспроизводимость установки.
---
backend: pacman

skip_if_no_internet: true
update_db: false
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: true
