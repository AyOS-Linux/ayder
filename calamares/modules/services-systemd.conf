# Ayder — services-systemd
# Включает необходимые службы в целевой системе
---
# Список сервисов для включения при загрузке
# services-systemd модуль из Calamares по умолчанию включает все сервисы из systemd-папки,
# но явно указываем NetworkManager для надёжности
services:
    - NetworkManager
    - NetworkManager-wait-online.service
