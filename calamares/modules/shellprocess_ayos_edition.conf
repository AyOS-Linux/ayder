# Ayder — shellprocess ayos_edition
# Ставит набор редакции (KDE/Plasma = everyday) и ядро linux в chroot целевой
# системы. Замена contextualprocess+packagechooser: выбора редакций больше нет.
# ДОЛЖЕН идти после shellprocess@ayos_osrelease (os-release цели уже AyOS -
# kernel-install собирает boot-запись по нему) и до initcpiocfg/initcpio.
---
dontChroot: false
timeout: 86400

script:
    - command: /usr/local/bin/ayos-edition everyday linux
      timeout: 86400
