# Ayder — shellprocess pacstrap (замена модуля ayospacstrap)
#
# Обычная установка обычным pacstrap из репозиториев Arch в примонтированный
# target. Выполняется на стороне LIVE (dontChroot: true): pacstrap требует
# рабочий pacman, а пустой target ещё нельзя chroot'нуть.
#
# Ключевое отличие от ayospacstrap (Python): прогресса у shellprocess НЕТ —
# полоса установки не двигается во время pacstrap, а прыгает по завершении
# job'а. Зато это штатный модуль Calamares, без своего кода.
#
# ЭКРАНИРОВАНИЕ $ (ВАЖНО): Calamares расширяет ${...} и $word в каждой команде
# ДО запуска (CommandList.cpp, DictionaryExpander с escape '$'). Неизвестное
# имя даёт ошибку и ВАЛЯТ установку. Поэтому в командах ниже:
#   $$repo, $$arch, $$h, $$f, $$d  ->  на выходе в sh: $repo, $h, ...
#   $$(...)                        ->  на выходе в sh: $(...)
#   ${ROOT}                        ->  путь к цели (rootMountPoint), в кавычках
#
# Ядро linux и nvidia-* здесь НЕ ставятся: их ставит shellprocess@ayos_edition
# в target-фазе, где уже готов AyOS os-release (kernel-install берёт заголовок
# boot-записи оттуда, а nvidia жёстко тянет ядро зависимостью).
---
dontChroot: true
timeout: 86400
verbose: true

i18n:
    name: Установка системных пакетов

script:
    # 1. Живой pacman-keyring: pacstrap гоняет pacman в host-энвайронменте,
    #    значит подписи проверяет ИМЕННО live-keyring. В live-среде его нет
    #    (squashfs собирается без /etc/pacman.d/gnupg) — инициализируем
    #    офлайн (ключи уже на диске, /usr/share/pacman/keyrings).
    #    Пропускаем, если keyring уже есть (повторный прогон установки).
    - command: >-
        if [ ! -f /etc/pacman.d/gnupg/pubring.gpg ]; then pacman-key --init && pacman-key --populate archlinux; fi
      timeout: 600

    # 2. Скорость: pacstrap берёт host-мирлист. Первый сервер там worldwide —
    #    через slirp+NAT он может быть «медленным, но живым» (pacman не
    #    переключается дальше, пока что-то работает). Ставим проверенно
    #    быстрый сервер первым, остальной список остаётся фолбэком.
    #    Ошибка здесь некритична -> не должна валить установку.
    - command: >-
        if [ -f /etc/pacman.d/mirrorlist ] && ! grep -q mirror.yandex.ru /etc/pacman.d/mirrorlist; then printf '%s\n' 'Server = https://mirror.yandex.ru/archlinux/$$repo/os/$$arch' | cat - /etc/pacman.d/mirrorlist > /etc/pacman.d/mirrorlist.ayder && mv /etc/pacman.d/mirrorlist.ayder /etc/pacman.d/mirrorlist; fi || true
      timeout: 60

    # 3. САМА УСТАНОВКА. Тот же вызов, что был в ayospacstrap/main.py:
    #    pacstrap <root> <пакеты>, --noconfirm у pacstrap по умолчанию.
    #    Список = базис (ядро+firmware, сеть, звук, драйверы, утилиты)
    #    + набор редакции KDE (everyday) — иначе большая загрузка Plasma шла
    #    бы молча в shellprocess@ayos_edition и могла быть прибита таймаутом.
    #    Пины-детерминизм: mkinitcpio (= провайдер initramfs), pipewire-jack
    #    (= jack), iptables (= iptables) — иначе pacman выбирает дефолт по
    #    порядку репо, что отличается между хостом и чистым pacman.conf цели.
    - command: >-
        pacstrap ${ROOT}
        base base-devel mkinitcpio linux-firmware
        amd-ucode intel-ucode
        sudo nano vim git wget curl
        networkmanager network-manager-applet nm-connection-editor
        wpa_supplicant iwd wireless-regdb iptables polkit accountsservice
        xdg-user-dirs xdg-utils xdg-desktop-portal xdg-desktop-portal-gtk
        pipewire pipewire-pulse pipewire-alsa pipewire-jack wireplumber
        sof-firmware alsa-firmware alsa-utils
        gstreamer gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav ffmpeg
        bluez bluez-utils bluez-obex
        mesa vulkan-radeon vulkan-intel vulkan-mesa-implicit-layers
        intel-media-driver libva-intel-driver xf86-video-amdgpu
        nvidia-utils nvidia-settings
        btrfs-progs dosfstools e2fsprogs exfatprogs f2fs-tools xfsprogs
        efibootmgr fastfetch zram-generator
        plasma-meta dolphin konsole kate discover
        sddm sddm-kcm plasma-nm plasma-pa xdg-desktop-portal-kde
        firefox kdegraphics-thumbnailers ffmpegthumbs
      timeout: 86400

    # 4. sudo для wheel (users.conf: sudoersGroup: wheel). sudo в наборе,
    #    но правило гарантируем явно — чистый target получает ванильные
    #    (закомментированные) sudoers из пакета.
    - command: >-
        mkdir -p ${ROOT}/etc/sudoers.d && printf '%s\n' '%wheel ALL=(ALL:ALL) ALL' > ${ROOT}/etc/sudoers.d/10-ayos && chmod 440 ${ROOT}/etc/sudoers.d/10-ayos

    # 5. Хелперы AyOS в цель. Chroot-модули Calamares (shellprocess@ayos_osrelease
    #    и shellprocess@ayos_edition) исполняют их ВНУТРИ цели (dontChroot: false),
    #    а pacstrap приносит только репозиторные пакеты. Источник — рабочий
    #    live-корень (мы в host-контексте).
    - command: >-
        mkdir -p ${ROOT}/usr/local/bin && for h in ayos-osrelease ayos-edition; do if [ -f /usr/local/bin/$$h ]; then cp -a /usr/local/bin/$$h ${ROOT}/usr/local/bin/; fi; done

    # 6. Ассеты хелперов (логотип fastfetch и прочее фирменное).
    - command: >-
        if [ -d /usr/share/ayos ]; then mkdir -p ${ROOT}/usr/share/ayos && cp -a /usr/share/ayos/. ${ROOT}/usr/share/ayos/; fi

    # 7. Обои и дефолтные конфиги под обои (KDE-скел) и zram: pacstrap приносит
    #    только пакетные файлы — airootfs-вложения live в target не попадают
    #    иначе, чем явной доставкой.
    - command: >-
        if [ -d /usr/share/backgrounds/ayos ]; then mkdir -p ${ROOT}/usr/share/backgrounds/ayos && cp -a /usr/share/backgrounds/ayos/. ${ROOT}/usr/share/backgrounds/ayos/; fi
    - command: >-
        for f in /etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc /etc/systemd/zram-generator.conf; do if [ -e $$f ]; then mkdir -p ${ROOT}$$(dirname $$f) && cp -a $$f ${ROOT}$$f; fi; done

    # 8. Собственные «оптимизации» (в стиле CachyOS, но свои и без сборки
    #    нового ядра): ParallelDownloads в pacman и MAKEFLAGS=-j$(nproc) в
    #    makepkg — простые текстовые патчи конфигов target'а.
    #    Ошибка некритична -> не должна валить установку.
    - command: >-
        if ! grep -q '^ParallelDownloads' ${ROOT}/etc/pacman.conf; then sed -i '/^\[options\]/a # AyOS: downloads in parallel (packet set is large)' ${ROOT}/etc/pacman.conf && sed -i '/^# AyOS: downloads in parallel/a ParallelDownloads = 10' ${ROOT}/etc/pacman.conf; fi || true
      timeout: 60
    - command: >-
        if grep -q '^#MAKEFLAGS' ${ROOT}/etc/makepkg.conf; then sed -i 's|^#MAKEFLAGS.*|MAKEFLAGS="-j$$(nproc)"|' ${ROOT}/etc/makepkg.conf; fi || true
      timeout: 60
