# Ayder — settings.conf
# Формат сверён по исходникам Calamares 3.4.3 (Settings.cpp) и upstream settings.conf:
#  - top-level "sequence" = список {show: [...]}/{exec: [...]}
#  - "modules-search: [ local ]" ОБЯЗАТЕЛЕН: без него "Found 0 modules"
#  - required-ключи: prompt-install, dont-chroot, oem-setup, disable-cancel,
#    disable-cancel-during-exec, hide-back-and-next-during-exec, quit-at-end
#
# Шаги: локаль (язык + ЧАСОВОЙ ПОЯС) -> диск -> пользователь -> установка.
# Всё. Приветствие, клавиатура и выбор пакетов убраны; выбора редакции нет —
# только KDE (набор everyday ставит shellprocess@ayos_edition).
---
modules-search: [ local ]

branding: ayder

instances:
    - id: ayos_osrelease
      module: shellprocess
      config: shellprocess_ayos_osrelease.conf
    - id: ayos_edition    # фиксированный набор KDE: /usr/local/bin/ayos-edition everyday
      module: shellprocess
      config: shellprocess_ayos_edition.conf
    - id: pacstrap        # настоящая установка: обычный pacstrap свежей системы
                          # из репозиториев в mounted-target (базис + firmware +
                          # сеть + аудио + драйверы + набор KDE). Вместо копии
                          # squashfs (unpackfs убран) и вместо модуля ayospacstrap.
                          # Выполняется снаружи (dontChroot: true), т.к. pacstrap
                          # требует рабочий pacman, а пустой target не chroot'нется.
      module: shellprocess
      config: shellprocess_pacstrap.conf

# Стандартные ключи установщика (upstream-дефолты)
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

# Модули с UI, показываемые в сайдбаре установщика
sequence:
    - show:
        - locale
        - partition
        - users
        - summary

    # Фазы выполнения установки
    - exec:
        - partition
        - mount
        - shellprocess@pacstrap   # настоящая установка: pacstrap свежей системы
                                  # из репозиториев в mounted-target (базис +
                                  # firmware + сеть + аудио + драйверы + набор
                                  # KDE). Вместо копии squashfs (unpackfs убран).
                                  # fstab-модуль ниже генерирует /etc/fstab - это
                                  # тот же результат, что genfstab.
        - machineid
        - fstab
        - locale
        - keyboard        # show-страницы нет: применяется раскладка по умолчанию
        - localecfg
        - shellprocess@ayos_osrelease # финальный os-release ДО установки пакетов:
                                      # kernel-install (сборка boot-записи в ходе
                                      # pacman-транзакции) берёт заголовок из PRETTY_NAME
        - shellprocess@ayos_edition   # пакеты KDE + ядро (linux) в chroot целевой
                                      # системы; ДОЛЖЕН выполняться до initcpiocfg/initcpio
        - initcpiocfg      # Arch-native: настройки mkinitcpio
        - initcpio         # запуск mkinitcpio в целевой системе
        - luksbootkeyfile
        - users
        - hwclock
        - services-systemd
        - bootloader       # systemd-boot (UEFI)
        - displaymanager   # enable sddm в целевой системе
        - umount

    - show:
        - finished
